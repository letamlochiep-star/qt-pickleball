.seg button[data-switch-group]{cursor:pointer;min-width:105px;position:relative;z-index:1}
.seg button[data-switch-group].active{outline:2px solid #0b8093;outline-offset:-2px}
.seg button[data-switch-group]:focus-visible{outline:3px solid #ef9b35;outline-offset:2px}
/* --- v3: auth + admin UI --- */
.auth-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:#0b8093;color:#fff;font-weight:700;font-size:12px}
.auth-chip .auth-logout{background:transparent;border:1px solid #fff;color:#fff;padding:2px 8px;border-radius:99px;cursor:pointer;font-size:11px}
.auth-chip.anon{background:#596974;opacity:.9}
.login-btn{background:#b73c37;border:0;color:#fff;padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:700}
.login-btn.ref{background:#087c89}
.modal-bg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:480px;width:100%;box-shadow:0 14px 40px #0004}
.modal h3{margin:0 0 12px;font-size:18px}
.modal label{display:block;margin:8px 0 3px;font-weight:650;font-size:13px}
.modal input{width:100%;padding:9px 11px;border:1px solid #c9d9df;border-radius:9px;font:inherit}
.modal .actions{margin-top:16px;display:flex;gap:8px;justify-content:flex-end}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#fde6e4;color:#b73c37;margin-left:6px}
.badge.ok{background:#e0f5e9;color:#12784b}
.warn-line{padding:8px 12px;background:#fff4e3;border-left:3px solid #d28d25;border-radius:7px;margin:8px 0;font-size:13px}
.err-line{padding:8px 12px;background:#fff0ef;border-left:3px solid #ba443d;border-radius:7px;margin:8px 0;font-size:13px}
.log-list{max-height:380px;overflow:auto;background:#f8fbfc;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:12px}
.log-list .l-row{padding:4px 2px;border-bottom:1px dashed #e0e8ec;display:grid;grid-template-columns:140px 110px 1fr;gap:10px}
.log-list .l-row:last-child{border-bottom:0}
.log-list .l-t{color:#596974}
.log-list .l-u{color:#0b6c78;font-weight:650}
.mini-input{padding:5px 7px;border:1px solid #c9d9df;border-radius:6px;font:inherit;width:100%;min-width:70px}
.mini-input.readonly{background:#f1f5f7;color:#425664;border-color:#e3eaec}
.r16-preview{background:#f5f9fb;border-radius:10px;padding:12px;margin:10px 0;font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.75}
.r16-preview .slot{display:grid;grid-template-columns:60px 1fr 120px;gap:8px;padding:3px 4px}
.r16-preview .slot.warn{background:#fff4e3;border-radius:5px}
.r16-preview .slot.ok{background:#f1f9f3}
.third-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.third-picker .box{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fdfefe}
.third-picker .box.locked{background:#eef8ef;border-color:#a9d9b8}
.third-picker select{width:100%;padding:8px 10px;border:1px solid #c9d9df;border-radius:8px;font:inherit}
.third-picker .lbl{font-weight:700;margin-bottom:4px;color:#0b6c78}
.third-picker .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
@media(max-width:640px){.third-picker{grid-template-columns:1fr}}
/* --- v3.1: Bảng ma trận vòng tròn --- */
.bd-full-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.bd-full-head b{font-size:17px;color:#102c43}
.bd-schedule-wrap{margin:8px 0;overflow-x:auto;text-align:center}
.bd-sched{border-collapse:collapse;font-size:12px;margin:0 auto 8px;display:inline-table}
.bd-sched th,.bd-sched td{border:1px solid #9bb3ba;padding:5px 10px;text-align:center;line-height:1.5}
.bd-sched th{background:#edf5f7;font-weight:700;font-size:11px;letter-spacing:.3px}
.bd-sched .lbl{background:#f4f7f9;font-weight:700}
.bd-matrix{width:100%;border-collapse:collapse;margin:8px 0 10px;font-size:12.5px;min-width:0}
.bd-matrix th,.bd-matrix td{border:1px solid #9bb3ba;padding:5px 4px;text-align:center;vertical-align:middle;min-width:30px}
.bd-matrix th{background:#edf5f7;font-weight:700;font-size:11px;letter-spacing:.2px}
.bd-matrix td.bd-team{text-align:left;min-width:92px;padding-left:6px;font-size:11.5px}
.bd-matrix td.bd-team b{color:#102c43}
.bd-matrix td.bd-diag{background:#142f43}
.bd-matrix td.bd-win{background:#d4f0dd;font-weight:700;color:#0e5f36}
.bd-matrix td.bd-empty{color:#b4c2c8}
.bd-matrix td.bd-pts{background:#fdf6e3;font-weight:700;color:#8b6914}
.bd-matrix td.bd-hs{background:#eef4f7;font-weight:600}
.bd-matrix td.bd-rank{background:#e3f2f1;font-weight:700;color:#0b6c78;font-size:14px}
.bd-rank-summary{background:#edf8f2;padding:9px 11px;border-radius:7px;font-size:12px;line-height:1.75;margin-top:4px}
.bd-rank-summary div{margin:1px 0}
.bd-rank-summary .lbl{display:inline-block;min-width:36px;color:#0e5f36;font-weight:700}
@media(max-width:620px){.bd-matrix td.bd-team{min-width:70px;font-size:11px}.bd-matrix th,.bd-matrix td{padding:4px 2px;min-width:26px}}
/* --- Điều lệ giải --- */
.doc-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 36px;line-height:1.75}
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.doc-header .left{font-weight:700;font-size:13px;text-align:center}
.doc-header .right{font-size:13px;text-align:center}
.doc-header .right b{font-size:13.5px;letter-spacing:.3px}
.doc-header hr{width:120px;margin:5px auto;border:0;border-top:1.5px solid #102c43}
.doc-title{text-align:center;margin:26px 0 22px}
.doc-title h2{font-size:22px;margin:0 0 6px;text-transform:uppercase;color:var(--navy);letter-spacing:.8px}
.doc-title h3{font-size:15px;margin:0 0 6px;color:var(--teal);text-transform:uppercase;letter-spacing:.4px}
.doc-title p{font-size:13px;color:var(--muted);margin:0;font-style:italic}
.doc-article{margin-bottom:16px}
.doc-article h4{font-size:14.5px;color:var(--navy);margin:14px 0 6px}
.doc-article ol{padding-left:22px;margin:6px 0}
.doc-article li{margin-bottom:6px;font-size:13.5px;color:#243a48}
.doc-footer{display:flex;justify-content:space-between;margin-top:32px;padding-top:20px;border-top:1px dashed var(--line);flex-wrap:wrap;gap:20px}
.doc-sign{text-align:center;min-width:180px}
.doc-sign b{text-transform:uppercase;font-size:14px;color:var(--navy);display:block;margin-bottom:40px}
@media(max-width:650px){.doc-box{padding:18px 16px}.doc-header{flex-direction:column;align-items:center;text-align:center}}
</style></head><body>

const SYNC_API = '/api/state';
let syncEnabled = false;
let syncVersion = 0;
let syncAdminToken = null;
let syncLastPushAt = 0;

async function syncDetect(){
  try {
    const res = await fetch(SYNC_API, { method:'GET', cache:'no-store' });
    if(!res.ok) throw new Error('status '+res.status);
    syncEnabled = true;
    const data = await res.json();
    if(data && data.version > 0 && data.state){
      store = Object.assign(fresh(), data.state);
      if(!store.auth) store.auth={accounts:{},firstRunDone:false};
      if(!store.log) store.log=[];
      syncVersion = data.version;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){}
      console.log('[SYNC] Đã kéo dữ liệu từ server v'+syncVersion);
    }
  } catch(e){
    syncEnabled = false;
    console.log('[SYNC] Offline mode');
  }
}

async function syncPush(){
  if(!syncEnabled || !syncAdminToken) return;
  const now = Date.now();
  if(now - syncLastPushAt < 500){
    setTimeout(()=>syncPush(), 600);
    return;
  }
  syncLastPushAt = now;
  try {
    const res = await fetch(SYNC_API, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-admin-token':syncAdminToken},
      body: JSON.stringify({ state: store })
    });
    if(res.ok){
      const data = await res.json();
      syncVersion = data.version;
      console.log('[SYNC] Push OK v'+syncVersion);
    } else if(res.status === 401){
      console.warn('[SYNC] Sai token admin, không push được (cập nhật ADMIN_PASSWORD trên Vercel)');
    }
  } catch(e){ console.warn('[SYNC] Push failed:', e); }
}

async function syncPull(){
  if(!syncEnabled) return;
  try {
    const res = await fetch(SYNC_API, { cache:'no-store' });
    if(!res.ok) return;
    const data = await res.json();
    if(data && data.version > syncVersion && data.state){
      store = Object.assign(fresh(), data.state);
      if(!store.auth) store.auth={accounts:{},firstRunDone:false};
      if(!store.log) store.log=[];
      syncVersion = data.version;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){}
      render();
      console.log('[SYNC] Pull v'+syncVersion);
    }
  } catch(e){ console.warn('[SYNC] Pull failed:', e); }
}

function syncStartPolling(){
  if(!syncEnabled) return;

    if(document.visibilityState === 'visible') syncPull();

// ─────────────────────────────────────────────
// 2) Crypto / Auth
// ─────────────────────────────────────────────
async function sha256(s){
  const buf=new TextEncoder().encode(s);
  const h=await crypto.subtle.digest('SHA-256',buf);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randSalt(){
  const b=new Uint8Array(16); crypto.getRandomValues(b);
  return [...b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function hashPw(pw,salt){ return await sha256(salt+pw); }

async function initAuth(){
  if(!store.auth) store.auth={accounts:{},firstRunDone:false};
  if(!store.auth.firstRunDone){
    const salt=randSalt();
    const hash=await hashPw(DEFAULT_ADMIN.password, salt);
    store.auth.accounts[DEFAULT_ADMIN.username]={
      salt, hash, name:DEFAULT_ADMIN.name, role:'admin',
      lastLogin:null, matchesScored:0, createdAt:Date.now()
    };
    store.auth.firstRunDone=true;
    save();
  }
}

async function tryLogin(username, password){
  const acc=store.auth.accounts[username];
  if(!acc) return {ok:false, err:'Tài khoản không tồn tại'};
  const h=await hashPw(password, acc.salt);
  if(h!==acc.hash) return {ok:false, err:'Sai mật khẩu'};
  acc.lastLogin=Date.now();
  currentUser={username, name:acc.name, role:acc.role};
  // Lưu token sync nếu là admin (plain password chỉ trong RAM, dùng cho header Vercel KV)
  if(acc.role==='admin') syncAdminToken = password;
  logAction('login','');
  save();
  return {ok:true};
}

function logout(){
  if(currentUser) logAction('logout','');
  currentUser=null;
  syncAdminToken=null;
  modalState=null;
  render();
}

async function addReferee(username, password, name){
  username=clean(username).toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(username)) return {ok:false,err:'Username 3-20 ký tự a-z, 0-9, _'};
  if(store.auth.accounts[username]) return {ok:false,err:'Username đã tồn tại'};
  if(password.length<4) return {ok:false,err:'Mật khẩu tối thiểu 4 ký tự'};
  const salt=randSalt();
  const hash=await hashPw(password,salt);
  store.auth.accounts[username]={salt,hash,name:clean(name)||username,role:'referee',lastLogin:null,matchesScored:0,createdAt:Date.now()};
  logAction('add_ref',`${username} · ${name}`);
  save();
  return {ok:true};
}

async function changePassword(username, newPw){
  const acc=store.auth.accounts[username];
  if(!acc) return {ok:false,err:'Không tìm thấy tài khoản'};
  if(newPw.length<4) return {ok:false,err:'Mật khẩu tối thiểu 4 ký tự'};
  const salt=randSalt();
  acc.salt=salt; acc.hash=await hashPw(newPw,salt);
  logAction('change_pw', username);
  save();
  return {ok:true};
}

function removeReferee(username){
  const acc=store.auth.accounts[username];
  if(!acc) return;
  if(acc.role==='admin'){ alert('Không thể xoá tài khoản admin.'); return; }
  if(!confirm(`Xoá tài khoản ${username} (${acc.name})?`)) return;
  delete store.auth.accounts[username];
  logAction('remove_ref', username);
  save();
  render();
}

// 4) Permission helpers
// ─────────────────────────────────────────────
const isAdmin = () => currentUser?.role==='admin';
const canEditScore = () => currentUser?.role==='admin' || currentUser?.role==='referee';
const isAdminUrl = () => window.location.hash==='#admin';

// ─────────────────────────────────────────────
// 5) Original logic (board build, validate, rank) — kept
// ─────────────────────────────────────────────
function getBoards(g){
  let out={};
  for(let b of Object.keys(QUOTA[mode][g]))
    out[b]=data().people.filter(p=>groupOf(p)===g&&p.board===b)
      .sort((x,y)=>Number((x.pos||'M99').slice(1))-Number((y.pos||'M99').slice(1))||x.id.localeCompare(y.id));
  return out;
}

function validate(){
  let errors=[],warnings=[],people=data().people,ids=new Set(),classes=new Map();
  for(let p of people){
    if(!p.id||!p.grade||!p.p1||!p.p2) errors.push('Thiếu mã cặp, khối hoặc tên vận động viên: '+(p.id||'?'));
    if(ids.has(p.id)) errors.push('Trùng mã cặp '+p.id);
    ids.add(p.id);
    if(p.board&&!QUOTA[mode][groupOf(p)]?.[p.board]) errors.push('Bảng '+p.board+' không hợp lệ cho '+p.id);
    for(let n of [p.p1,p.p2]){
      let key=p.className.trim().toLocaleLowerCase()+'|'+n.trim().toLocaleLowerCase();
      if(classes.has(key)) warnings.push('Kiểm tra tên trùng cùng lớp: '+n+' ('+p.className+')');
      classes.set(key,p.id);
    }
  }
  for(let g of ['67','89']){
    let boards=getBoards(g);
    for(let [b,expected] of Object.entries(QUOTA[mode][g])){
      let members=boards[b];
      if(members.length!==expected) errors.push(groupName(g)+' bảng '+b+': '+members.length+'/'+expected+' cặp');
      for(let p of members){
        let pgrade=ALLOC[mode][p.grade]?.[b]||0;
        if(!pgrade) errors.push('Cặp '+p.id+' không có suất bốc vào bảng '+b);
      }
      for(let grade of (g==='67'?[6,7]:[8,9])){
        let actual=members.filter(x=>x.grade===grade).length,ex=ALLOC[mode][grade]?.[b]||0;
        if(actual!==ex) errors.push('Suất khối '+grade+' bảng '+b+': '+actual+'/'+ex);
      }
    }
  }
  if(people.length!==50) errors.push('Danh sách '+people.length+'/50 cặp.');
  for(let [grade,ex] of [[6,11],[7,11],[8,10],[9,18]])
    if(people.filter(p=>p.grade===grade).length!==ex) errors.push('Khối '+grade+': sai số cặp (cần '+ex+').');
  if(people.some(p=>p.note)) warnings.push('Có thông tin gốc cần xác nhận trong cột Ghi chú.');
  return {errors:[...new Set(errors)], warnings:[...new Set(warnings)]};
}

function team(id){ return data().people.find(p=>p.id===id)||null; }
function teamName(id){ let p=team(id); return p?`${p.id} · ${p.className} · ${p.p1} / ${p.p2}`:'Chờ kết quả'; }
function mk(id,g,stage,a,z,board=''){ return {id,g,stage,board,a,z}; }

function calc(){
  const checks=validate(), ready=checks.errors.length===0;
  const matches=[], rankings={}, issues=[], res={}, champ={};
  if(!ready) return {...checks,ready,matches,rankings,issues,res,champ,completed:0,total:90};

  const resolve=ref=>{
    if(!ref) return null;
    if(ref.k==='id') return ref.id;
    if(ref.k==='win') return res[ref.id]?.win||null;
    if(ref.k==='lose') return res[ref.id]?.lose||null;
    if(ref.k==='rank') return rankings[ref.g]?.[ref.b]?.[ref.n-1]||null;
    if(ref.k==='third67') return rankings['67']?._third?.[ref.i]||null;
    return null;
  };
  function finish(m){
    let x=resolve(m.a), y=resolve(m.z);
    m.x=x; m.y=y;
    let s=data().scores[m.id];
    if(s&&s.x===x&&s.y===y&&validScore(s.a,s.b))
      res[m.id]={win:s.a===11?x:y, lose:s.a===11?y:x, a:s.a, b:s.b};
    else if(s&&(s.x!==x||s.y!==y))
      issues.push('Kết quả cũ '+m.id+' không còn đúng hai đội, chưa được tính.');
    matches.push(m);
  }

  // Vòng bảng
  for(let g of ['67','89']){
    rankings[g]={};
    for(let [b,arr] of Object.entries(getBoards(g))){
      let ids=arr.map(p=>p.id), boardMatches=[];
      for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++)
        boardMatches.push(mk(`${g}-BG-${b}-${i+1}${j+1}`, g, 'Vòng bảng', {k:'id',id:ids[i]}, {k:'id',id:ids[j]}, b));
      boardMatches.forEach(finish);

      if(boardMatches.every(m=>res[m.id])){
        let records=Object.fromEntries(ids.map(id=>[id,{id,w:0,played:0,pf:0,pa:0,diff:0}]));
        for(let m of boardMatches){
          let r=res[m.id], a=records[m.x], z=records[m.y];
          a.played++; z.played++;
          a.pf+=r.a; a.pa+=r.b; z.pf+=r.b; z.pa+=r.a;
          if(r.win===m.x) a.w++; else z.w++;
        }
        for(let r of Object.values(records)) r.diff=r.pf-r.pa;
        let list=Object.values(records);
        const cmp=(a,b)=>{
          if(a.w!==b.w) return b.w-a.w;
          let tied=list.filter(q=>q.w===a.w);
          if(tied.length===2){
            let h=boardMatches.find(m=>(m.x===a.id&&m.y===b.id)||(m.x===b.id&&m.y===a.id));
            if(h){
              let hwin=res[h.id].win;
              if(hwin===a.id) return -1;
              if(hwin===b.id) return 1;
            }
          }
          if(a.diff!==b.diff) return b.diff-a.diff;
          if(a.pf!==b.pf) return b.pf-a.pf;
          return 0;
        };
        list.sort((a,b)=>cmp(a,b)||a.id.localeCompare(b.id,'vi'));
        let tie=false;
        for(let i=0;i<list.length-1;i++) if(cmp(list[i],list[i+1])===0) tie=true;
        let override=data().manual[`${g}-${b}`];
        if(tie&&(!override||override.length!==ids.length||new Set(override).size!==ids.length||override.some(id=>!ids.includes(id)))){
          issues.push(`Bảng ${b} trình ${g} hòa chỉ số, cần chốt thứ hạng thủ công.`);
          rankings[g][b]=null;
        } else rankings[g][b]=tie?override:list.map(x=>x.id);
        rankings[g]['_stats_'+b]=records;
      } else rankings[g][b]=null;
    }
  }

  // Suất hạng ba trình 67
  let third67=[];
  let ranks67 = rankings['67'];
  for(let [b,n] of Object.entries(QUOTA.PA1['67']))
    if(ranks67[b]&&ranks67[b][2]){
      let r=ranks67['_stats_'+b][ranks67[b][2]];
      third67.push({id:r.id,board:b,rate:r.w/r.played,avgdiff:r.diff/r.played,avgpf:r.pf/r.played,w:r.w,played:r.played});
    }
  third67.sort((a,b)=>b.rate-a.rate||b.avgdiff-a.avgdiff||b.avgpf-a.avgpf||a.id.localeCompare(b.id));
  rankings['67']._thirdList=third67;

  // XẾP TAY ưu tiên tuyệt đối. Thuật toán chỉ gợi ý.
  let manualThird=data().thirdChoice;
  if(manualThird && manualThird.length===2 && new Set(manualThird).size===2
    && manualThird.every(id=>third67.some(t=>t.id===id))){
    rankings['67']._third=[...manualThird];
  } else if(third67.length===7){
    // Gợi ý tự động
    let eligible=data().allowZeroThird?third67:third67.filter(x=>x.w>0);
    if(eligible.length>=2){
      rankings['67']._third=[eligible[0].id, eligible[1].id];
      rankings['67']._thirdAuto=true;
    } else {
      issues.push('Không đủ 2 cặp hạng ba đã thắng trận. BTC xét ngoại lệ hoặc chốt thủ công.');
      rankings['67']._third=null;
    }
  } else rankings['67']._third=null;

  // NHÁNH 1/8 — ghép đôi MỚI cho trình 6-7 (chống trùng bảng)
  // 67: [A1-G2, D1-E2, B1-F2, C1-Third1, E1-D2, Third0-A2, F1-B2, G1-C2]
  const pair67=[
    [{k:'rank',g:'67',b:'A',n:1},{k:'rank',g:'67',b:'G',n:2}],
    [{k:'rank',g:'67',b:'D',n:1},{k:'rank',g:'67',b:'E',n:2}],
    [{k:'rank',g:'67',b:'B',n:1},{k:'rank',g:'67',b:'F',n:2}],
    [{k:'rank',g:'67',b:'C',n:1},{k:'third67',i:1}],
    [{k:'rank',g:'67',b:'E',n:1},{k:'rank',g:'67',b:'D',n:2}],
    [{k:'third67',i:0},{k:'rank',g:'67',b:'A',n:2}],
    [{k:'rank',g:'67',b:'F',n:1},{k:'rank',g:'67',b:'B',n:2}],
    [{k:'rank',g:'67',b:'G',n:1},{k:'rank',g:'67',b:'C',n:2}]
  ];
  // 89: giữ nguyên ghép đôi cũ (đã test không có rủi ro cùng bảng ở QF/SF)
  const pair89=[['A','H'],['D','E'],['B','G'],['C','F'],['E','D'],['H','A'],['F','C'],['G','B']];

  for(let g of ['67','89']){
    for(let i=0;i<8;i++){
      let aRef, zRef;
      if(g==='67'){ [aRef, zRef]=pair67[i]; }
      else { let [b,c]=pair89[i]; aRef={k:'rank',g,b,n:1}; zRef={k:'rank',g,b:c,n:2}; }
      finish(mk(`${g}-R16-${i+1}`, g, 'Vòng 1/8', aRef, zRef));
    }
    for(let i=1;i<=4;i++) finish(mk(`${g}-QF-${i}`, g, 'Tứ kết', {k:'win',id:`${g}-R16-${2*i-1}`}, {k:'win',id:`${g}-R16-${2*i}`}));
    for(let i=1;i<=2;i++) finish(mk(`${g}-SF-${i}`, g, 'Bán kết', {k:'win',id:`${g}-QF-${2*i-1}`}, {k:'win',id:`${g}-QF-${2*i}`}));
    finish(mk(`${g}-FINAL`, g, 'Chung kết', {k:'win',id:`${g}-SF-1`}, {k:'win',id:`${g}-SF-2`}));
    champ[g]=res[`${g}-FINAL`]?.win||null;
  }

  return {...checks, ready, matches, rankings, issues, res, champ, third67, completed:Object.keys(res).length, total:90};
}

function validScore(a,b){
  return Number.isInteger(a) && Number.isInteger(b) && a>=0 && b>=0
    && ((a===11&&b<=10) || (b===11&&a<=10));
}

// ─────────────────────────────────────────────
// 6) Scoreboard & submit — permission-aware
// ─────────────────────────────────────────────
function scoreboard(m,c){
  let r=c.res[m.id], s=data().scores[m.id], isValid=!!m.x&&!!m.y;
  let valA=r?r.a:'', valB=r?r.b:'';
  let canEdit=canEditScore()&&isValid;
  let refInfo=s?.refName?`<div class="help">Trọng tài chốt: <b>${esc(s.refName)}</b> (${esc(s.refUsername||'')})</div>`:'';
  return `<article class="match ${isValid?'':'inactive'}">
    <div class="matchhead"><strong>${esc(m.id)}</strong>
      <span class="pill ${r?'':'gray'}">${esc(m.stage)}${m.board?' · Bảng '+m.board:''} ${r?'✓ Đã chốt':'· Chưa đấu'}</span>
    </div>
    <div class="matchbody">
      <div class="team ${r&&r.win===m.x?'win':''}">${esc(teamName(m.x))}</div>
      <input aria-label="Điểm đội 1" class="score" type="number" min="0" max="11" id="sa_${m.id}" value="${valA}" ${canEdit?'':'disabled'}>
      <b>:</b>
      <input aria-label="Điểm đội 2" class="score" type="number" min="0" max="11" id="sb_${m.id}" value="${valB}" ${canEdit?'':'disabled'}>
      <div class="team ${r&&r.win===m.y?'win':''}">${esc(teamName(m.y))}</div>
      ${canEdit?`<div class="match-btns" style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="btn primary" onclick="submitScore('${m.id}')">${r?'Cập nhật':'Chốt điểm'}</button>
        ${r?`<button class="btn danger" onclick="resetScore('${m.id}')" title="Xoá điểm trận này">🗑 Xoá điểm</button>`:''}
      </div>`:''}
    </div>
    ${r?`<div class="help">Thắng: <b>${esc(teamName(r.win))}</b> · Đổi sân ở mốc 6 điểm đầu tiên.</div>`:''}
    ${refInfo}
  </article>`;
}

function submitScore(id){
  if(!canEditScore()){ alert('Bạn chưa đăng nhập với quyền trọng tài.'); return; }
  let c=calc(), m=c.matches.find(x=>x.id===id);
  if(!m||!m.x||!m.y) return;
  let a=Number(byId('sa_'+id).value), b=Number(byId('sb_'+id).value);
  if(byId('sa_'+id).value===''||byId('sb_'+id).value===''||!validScore(a,b)){
    alert('Điểm không hợp lệ: đúng một đội phải đạt 11 và đội còn lại 0–10. Ví dụ 11–10.');
    return;
  }
  let previous=data().scores[id];
  if(previous&&((previous.a!==a)||(previous.b!==b))){
    // Cascade analysis: trận nào phụ thuộc kết quả này?
    let affected=analyzeCascade(id, m, a, b, c);
    if(affected.length){
      if(!isAdmin()){ alert(`Trận này đã có ${affected.length} trận phụ thuộc. Chỉ admin được sửa.`); return; }
      if(!confirmCascade(id, a, b, m, affected)) return;
    } else {
      if(!confirm('Thay đổi tỉ số. Xác nhận cập nhật?')) return;
    }
  }
  const acc = currentUser ? store.auth.accounts[currentUser.username] : null;
  data().scores[id]={a, b, x:m.x, y:m.y,
    refUsername: currentUser?.username||'',
    refName: currentUser?.name||'',
    at: Date.now()
  };
  if(acc) acc.matchesScored=(acc.matchesScored||0)+(previous?0:1);
  logAction(previous?'edit_score':'set_score', `${id}: ${a}-${b}`, id);
  save(); render();
}

function analyzeCascade(id, m, newA, newB, c){
  // Tìm những trận res[trận-sau] mà depend vào winner của id
  let affected=[], visited=new Set();
  function visit(nid){
    if(visited.has(nid)) return;
    visited.add(nid);
    for(let mm of c.matches){
      if((mm.a?.k==='win'&&mm.a.id===nid)||(mm.z?.k==='win'&&mm.z.id===nid)){
        if(c.res[mm.id]) affected.push(mm.id);
        visit(mm.id);
      }
    }
  }
  // Nếu kết quả thắng/thua đảo, mới phá nhánh
  let s=data().scores[id];
  if(!s) return [];
  let oldWin=s.a===11?m.x:m.y;
  let newWin=newA===11?m.x:m.y;
  if(oldWin===newWin){
    // chỉ đổi tỉ số không đổi đội thắng → có ảnh hưởng xếp hạng bảng?
    if(m.stage==='Vòng bảng') visit(id); // xếp hạng bảng có thể đổi → mọi trận sau đều phụ thuộc
    return affected;
  }
  visit(id);
  return affected;
}

function confirmCascade(id, a, b, m, affected){
  let msg=`Trận ${id} đổi tỉ số ${data().scores[id].a}-${data().scores[id].b} → ${a}-${b}\n\n` +
    `⚠ ${affected.length} trận sau đây có thể bị vô hiệu do thay đổi:\n` +
    affected.slice(0,10).map(x=>'  • '+x).join('\n') +
    (affected.length>10?`\n  ... (+${affected.length-10} trận)`:'') +
    `\n\nGõ "XAC NHAN" để tiếp tục:`;
  let ans=prompt(msg,'');
  return ans==='XAC NHAN';
}

function resetScore(id){
  if(!canEditScore()){ alert('Bạn chưa đăng nhập với quyền trọng tài.'); return; }
  let c=calc(), m=c.matches.find(x=>x.id===id);
  if(!m) return;
  let s=data().scores[id];
  if(!s){ alert('Trận này chưa có điểm để xoá.'); return; }

  // Phân tích cascade
  let affected = [];
  function visit(nid){
    for(let mm of c.matches){
      if((mm.a?.k==='win'&&mm.a.id===nid)||(mm.z?.k==='win'&&mm.z.id===nid)){
        if(c.res[mm.id] && !affected.includes(mm.id)){
          affected.push(mm.id);
          visit(mm.id);
        }
      }
    }
  }
  if(m.stage==='Vòng bảng'){
    // Xếp hạng bảng có thể đổi → mọi trận loại trực tiếp của trình đó phụ thuộc gián tiếp
    for(let mm of c.matches){
      if(mm.id!==id && mm.stage!=='Vòng bảng' && mm.g===m.g && c.res[mm.id]){
        affected.push(mm.id);
      }
    }
  } else {
    visit(id);
  }

  if(affected.length){
    if(!isAdmin()){
      alert(`Trận ${id} đã có ${affected.length} trận phụ thuộc có kết quả. Chỉ admin được xoá.`);
      return;
    }
    let msg = `Xoá điểm trận ${id} (hiện ${s.a}–${s.b}).\n\n` +
      `⚠ ${affected.length} trận phụ thuộc có thể bị vô hiệu:\n` +
      affected.slice(0,10).map(x=>'  • '+x).join('\n') +
      (affected.length>10?`\n  ... (+${affected.length-10} trận)`:'') +
      `\n\nGõ "XOA" để tiếp tục:`;
    let ans=prompt(msg,'');
    if(ans!=='XOA') return;
  } else {
    if(!confirm(`Xoá điểm trận ${id} (hiện ${s.a}–${s.b})?`)) return;
  }

  // Trừ matchesScored của trọng tài gốc
  if(s.refUsername && store.auth.accounts[s.refUsername]){
    let acc = store.auth.accounts[s.refUsername];
    if(acc.matchesScored>0) acc.matchesScored--;
  }
  delete data().scores[id];
  logAction('reset_score', `${id} (xoá ${s.a}-${s.b})`, id);
  save(); render();
}

function cleanScores(){
  let c=calc(),good={};
  for(let [id,r] of Object.entries(c.res)) if(data().scores[id]) good[id]=data().scores[id];
  let n=Object.keys(data().scores).length-Object.keys(good).length;
  if(n){
    if(confirm('Xóa '+n+' tỉ số cũ không còn đúng cặp đấu?')){
      data().scores=good; logAction('clean_scores', n+' trận'); save(); render();
    }
  } else alert('Không có kết quả cũ không hợp lệ.');
}

function authBar(){
  let syncBadge = syncEnabled
    ? `<span class="badge ok" title="Đã kết nối backend Vercel KV">☁ Live v${syncVersion}</span>`
    : `<span class="badge" title="Chạy offline (localStorage)">◌ Offline</span>`;
  if(currentUser){
    let badge=currentUser.role==='admin'?'<span class="badge">ADMIN</span>':'<span class="badge ok">TRỌNG TÀI</span>';
    return `${syncBadge} <span class="auth-chip">👤 ${esc(currentUser.name)} ${badge} <button class="auth-logout" onclick="logout()">Đăng xuất</button></span>`;
  }
  let btns='';

function render(){
  let c=calc();
  let assigned=data().people.filter(p=>p.board).length;
  // Metrics
  byId('metrics').innerHTML=`
    <div class="metric"><strong>${data().people.length}</strong><span>Cặp vận động viên</span></div>
    <div class="metric"><strong>${assigned}/50</strong><span>Cặp đã điền bảng</span></div>

    <div class="metric"><strong>${Object.values(c.champ).filter(Boolean).length}/2</strong><span>Nhà vô địch đã xác định</span></div>`;

  // Status
  let z=!c.ready
    ? `<b>Chưa đủ dữ liệu để tạo lịch đấu.</b> ${c.errors.slice(0,3).map(esc).join(' · ')}${c.errors.length>3?' · ...('+c.errors.length+' lỗi)':''}`

  byId('status').className='notice '+(!c.ready?'err':c.issues.length?'warn':'');
  byId('status').innerHTML=z;

  // Auth bar in header
  byId('authBar').innerHTML=authBar();

  // Toolbar buttons: chỉ xuất hiện ở chế độ quản trị hoặc trọng tài
  if(byId('toolbarTools')){
    if(canEditScore()){
      let tb = `<button class="btn" onclick="backup()">Xuất bản sao JSON</button>`;
      if(isAdmin()) tb += `<button class="btn" onclick="byId('restoreFile').click()">Nạp bản sao</button>`;

      byId('toolbarTools').innerHTML = tb;
    } else {
      byId('toolbarTools').innerHTML = '';
    }
  }

  // Menu: Nạp Excel chỉ hiện với Admin/Trọng tài
  let menu = tab('overview','◈ Tổng quan');
  if(canEditScore()) menu += tab('import','⇧ Nạp dữ liệu Excel');
  menu += tab('teams','☷ Danh sách và bốc thăm')+tab('groups','▦ Bảng đấu / Xếp hạng')+tab('matches','⚑ Nhập tỉ số trận đấu')+tab('bracket','◇ Nhánh loại trực tiếp')+tab('awards','★ Kết quả và giải thưởng')+tab('rules','📜 Điều lệ giải');
  if(isAdmin() && isAdminUrl()) menu += tab('admin','🔐 Quản trị');
  byId('menu').innerHTML = menu;

  if(screen==='import' && !canEditScore()) screen='overview';

  // Content
  let html='';
  if(screen==='overview') html=overviewHTML(c);
  else if(screen==='import') html=importHTML(c);
  else if(screen==='teams') html=teamsHTML(c);
  else if(screen==='groups') html=groupsHTML(c);
  else if(screen==='matches') html=matchesHTML(c);
  else if(screen==='bracket') html=bracketHTML(c);
  else if(screen==='awards') html=awardsHTML(c);
  else if(screen==='admin') html=adminHTML(c);
  else if(screen==='rules'||screen==='guide') html=rulesHTML(c);
  else html=overviewHTML(c);
  byId('page').innerHTML=html;

  // Modal
  byId('modalRoot').innerHTML=modalState?modalHTML():'';
}

function editPlayer(id, key, val, shouldRender = true){
  if(!isAdmin()){ return; }
  let p=team(id); if(!p) return;
  if(key==='grade'){
    let oldG=groupOf(p), newG=val<8?'67':'89';
    if(oldG!==newG){ alert('Không được chuyển khối qua trình khác (phá quota).'); render(); return; }
    p.grade=val;
    p.board=''; data().scores={}; data().manual={}; data().thirdChoice=[]; data().thirdChoiceLockedAt=null; data().thirdChoiceLockedBy=null;
  } else {
    p[key]=clean(val);
  }
  logAction('edit_player', `${id} · ${key}: ${JSON.stringify(val)}`, id);
  save();
  if(shouldRender) render();
}

function editPlayerId(oldId, newId){
  if(!isAdmin()){ alert('Chỉ admin'); return; }
  newId=clean(newId);
  if(!newId || newId===oldId){ render(); return; }
  if(data().people.some(p=>p.id===newId)){ alert('Mã cặp đã tồn tại'); render(); return; }
  let ans=prompt('Đổi mã cặp sẽ MẤT TOÀN BỘ ĐIỂM của cặp này.\nGõ chính xác "DONGY" để xác nhận:','');
  if(ans!=='DONGY'){ render(); return; }
  let p=team(oldId); if(!p){ render(); return; }
  p.id=newId;
  // Xoá tất cả score liên quan oldId
  for(let [sid,s] of Object.entries(data().scores))
    if(s.x===oldId||s.y===oldId) delete data().scores[sid];
  logAction('rename_player', `${oldId} → ${newId}`, newId);
  save(); render();
}

function assign(id,key,val){
  if(!isAdmin()){ alert('Chỉ admin được đổi phân bảng'); render(); return; }
  let p=team(id); if(!p) return;
  if(Object.keys(data().scores).length && !confirm('Đổi phân bảng khi đã có điểm sẽ xoá toàn bộ kết quả. Xác nhận?')){ render(); return; }
  p[key]=val;
  data().scores={}; data().manual={}; data().thirdChoice=[]; data().thirdChoiceLockedAt=null; data().thirdChoiceLockedBy=null;
  logAction('change_board', `${id} → ${val}`, id);
  save(); render();
}

// ─── Bảng ma trận vòng tròn (3 hoặc 4 đội) ───
function renderBoardMatrix(b, members, c, g){
  const n = members.length;
  const matches = c.matches.filter(m => m.g===g && m.board===b && m.stage==='Vòng bảng');
  const ranking = c.rankings[g]?.[b];
  const stats = c.rankings[g]?.['_stats_'+b] || {};
  const doneCount = matches.filter(m => c.res[m.id]).length;

  // Lịch đấu theo chuẩn Berger
  let schedule;
  if(n===3) schedule = [[[1,2]], [[1,3]], [[2,3]]];
  else if(n===4) schedule = [[[1,4],[2,3]], [[1,2],[3,4]], [[1,3],[2,4]]];
  else if(n===2) schedule = [[[1,2]]];
  else schedule = null;

  let scheduleHtml = '';
  if(schedule){
    scheduleHtml = `<div class="bd-schedule-wrap"><table class="bd-sched">
      <tr><th class="lbl">Vòng</th>${schedule.map((_,i)=>`<th>Vòng ${i+1}</th>`).join('')}</tr>
      <tr><td class="lbl">Trận</td>${schedule.map(round=>`<td>${round.map(([a,z])=>a+' – '+z).join('<br>')}</td>`).join('')}</tr>
    </table></div>`;
  }

  // Lấy điểm giữa cặp i và cặp j (1-based, dành cho đội ở hàng i)
  function cellFor(ia, ib){
    if(ia===ib) return {diag:true};
    const [lo, hi] = ia<ib ? [ia, ib] : [ib, ia];
    const mid = `${g}-BG-${b}-${lo}${hi}`;
    const s = data().scores[mid];
    if(!s) return {val:'–', empty:true};
    const myId = members[ia-1].id;
    if(s.x===myId) return {val:s.a, win:s.a===11};
    if(s.y===myId) return {val:s.b, win:s.b===11};
    return {val:'?', empty:true};
  }

  // Hàng ma trận
  const rows = members.map((m, idx)=>{
    const i1 = idx+1;
    const r = stats[m.id];
    const pts = r ? r.w : 0;
    const hs = r ? (r.pf-r.pa) : 0;
    const rank = ranking ? (ranking.indexOf(m.id)+1 || '–') : '–';
    let cells = '';
    for(let j=1;j<=n;j++){
      const cd = cellFor(i1, j);
      if(cd.diag) cells += '<td class="bd-diag"></td>';
      else cells += `<td class="${cd.win?'bd-win':''} ${cd.empty?'bd-empty':''}">${cd.val}</td>`;
    }
    return `<tr>
      <td>${i1}</td>
      <td class="bd-team"><b>${esc(m.id)}</b> <span class="help">${esc(m.className)}</span></td>
      ${cells}
      <td class="bd-pts">${pts}</td>
      <td class="bd-hs">${hs===0?'0':(hs>0?'+'+hs:hs)}</td>
      <td class="bd-rank">${rank}</td>
    </tr>`;
  }).join('');

  const matrixHtml = `<table class="bd-matrix">
    <thead><tr>
      <th>TT</th><th>Cặp đấu</th>
      ${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}
      <th>Điểm</th><th>HS</th><th>Hạng</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  // Tóm tắt xếp hạng
  let rankSummary = '';
  if(ranking){
    const labels = ['Nhất','Nhì','Ba','Tư'];
    rankSummary = `<div class="bd-rank-summary">${ranking.map((id,i)=>
      `<div><span class="lbl">${labels[i]}:</span> ${esc(teamName(id))}</div>`
    ).join('')}</div>`;
  } else {
    rankSummary = `<div class="bd-rank-summary muted">Chưa đủ kết quả để xếp hạng (${doneCount}/${matches.length} trận).</div>`;
  }

  return `<div class="bd-full-head">
    <b>Bảng ${b}</b>

function renderThirdPlacePicker(c){
  let tt=c.rankings['67']?._thirdList||[];
  if(!tt.length) return `<h3 style="margin-top:22px">Chốt 2 suất hạng ba trình 6–7</h3><p class="help">Cần hoàn thành tất cả bảng A–G của trình 6-7 trước khi chốt.</p>`;

  let currentThird = c.rankings['67']?._third || [null,null];
  let isLocked = data().thirdChoice && data().thirdChoice.length===2;
  let canPick = isAdmin();

  // Phát hiện rủi ro cùng bảng nếu đã chốt
  let warnings=[];
  if(currentThird[0] && currentThird[1]){
    let t0=tt.find(x=>x.id===currentThird[0]);
    let t1=tt.find(x=>x.id===currentThird[1]);
    let ranks67=c.rankings['67'];
    let a2 = ranks67['A']?.[1], c1 = ranks67['C']?.[0];
    if(t0 && a2){
      let pA2 = team(a2), pT0 = team(t0.id);
      if(pA2 && pT0 && pA2.board===pT0.board) warnings.push(`R16-6: Third0 (${t0.id} bảng ${t0.board}) gặp A2 (${a2} bảng ${pA2.board}) — <b>CÙNG BẢNG</b>`);
    }
    if(t1 && c1){
      let pC1 = team(c1), pT1 = team(t1.id);
      if(pC1 && pT1 && pC1.board===pT1.board) warnings.push(`R16-4: Third1 (${t1.id} bảng ${t1.board}) gặp C1 (${c1} bảng ${pC1.board}) — <b>CÙNG BẢNG</b>`);
    }
  }

  // Preview nhánh
  let r16 = c.matches.filter(m=>m.g==='67' && m.stage==='Vòng 1/8').sort((a,b)=>a.id.localeCompare(b.id));
  let preview = r16.map(m=>{
    let tA = m.x ? team(m.x) : null;
    let tZ = m.y ? team(m.y) : null;
    let sameBoard = tA && tZ && tA.board===tZ.board;
    let aLbl = m.x ? `${m.x} (bảng ${tA?.board||'?'})` : '—';
    let zLbl = m.y ? `${m.y} (bảng ${tZ?.board||'?'})` : '—';
    return `<div class="slot ${sameBoard?'warn':'ok'}"><b>${m.id.replace('67-','')}</b><span>${esc(aLbl)} vs ${esc(zLbl)}</span><span>${sameBoard?'⚠ cùng bảng':'ok'}</span></div>`;
  }).join('');

  let dropdownOptions = (selectedId, excludeId) => tt.filter(x=>x.id!==excludeId).map(t=>
    `<option value="${esc(t.id)}" ${selectedId===t.id?'selected':''}>${esc(t.id)} · Bảng ${t.board} · ${t.w}w · HS ${t.avgdiff.toFixed(2)} · ĐG ${t.avgpf.toFixed(2)}</option>`
  ).join('');

  return `<h3 style="margin-top:22px">Chốt 2 suất hạng ba trình 6–7 ${isLocked?'<span class="badge ok">ĐÃ CHỐT</span>':'<span class="badge">CHƯA CHỐT</span>'}</h3>
    <div class="tablewrap"><table class="tbl">
      <thead><tr><th>Mã</th><th>Bảng</th><th>Thắng</th><th>Tỷ lệ</th><th>HS TB/trận</th><th>ĐG TB/trận</th></tr></thead>
      <tbody>${tt.map(t=>{
        let picked = currentThird.includes(t.id);
        return `<tr style="${picked?'background:#e0f5e9':''}">
          <td><b>${esc(t.id)}</b>${picked?' ⭐':''}</td><td>${t.board}</td>
          <td>${t.w}</td><td>${(t.rate*100).toFixed(1)}%</td>
          <td>${t.avgdiff.toFixed(2)}</td><td>${t.avgpf.toFixed(2)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>

    <div class="third-picker">
      <div class="box ${currentThird[0]?'locked':''}">
        <div class="lbl">Suất Third0</div>
        <div class="sub">Vào trận R16-6: Third0 vs A2</div>
        <select ${canPick?'':'disabled'} id="pickThird0">
          <option value="">— Chọn cặp —</option>
          ${dropdownOptions(currentThird[0], currentThird[1])}
        </select>
      </div>
      <div class="box ${currentThird[1]?'locked':''}">
        <div class="lbl">Suất Third1</div>
        <div class="sub">Vào trận R16-4: C1 vs Third1</div>
        <select ${canPick?'':'disabled'} id="pickThird1">
          <option value="">— Chọn cặp —</option>
          ${dropdownOptions(currentThird[1], currentThird[0])}
        </select>
      </div>
    </div>

    ${warnings.length?`<div class="warn-line"><b>⚠ Cảnh báo:</b><br>${warnings.join('<br>')}</div>`:''}

    <div class="actions">
      ${canPick?`
        <button class="btn primary" onclick="applyThirdChoice()">Chốt 2 suất</button>
        <button class="btn" onclick="suggestThirdAuto()">Áp dụng gợi ý tự động</button>
        <button class="btn" onclick="swapThirds()">Hoán vị Third0 ↔ Third1</button>
        ${isLocked?`<button class="btn danger" onclick="unlockThird()">Mở khoá</button>`:''}
      `:'<span class="help">Đăng nhập admin để chốt.</span>'}
    </div>

    ${isLocked ? `<p class="help">Chốt bởi ${esc(data().thirdChoiceLockedBy||'?')} lúc ${new Date(data().thirdChoiceLockedAt||0).toLocaleString('vi-VN')}</p>`:''}

    <h4 style="margin-top:16px">Xem trước nhánh 1/8 trình 6-7:</h4>
    <div class="r16-preview">${preview}</div>`;
}

function applyThirdChoice(){
  if(!isAdmin()){ alert('Chỉ admin'); return; }
  let t0 = byId('pickThird0').value.trim();
  let t1 = byId('pickThird1').value.trim();
  if(!t0 || !t1){ alert('Phải chọn đủ 2 suất'); return; }
  if(t0===t1){ alert('Hai suất phải khác nhau'); return; }
  data().thirdChoice = [t0, t1];
  data().thirdChoiceLockedAt = Date.now();
  data().thirdChoiceLockedBy = currentUser.username;
  logAction('lock_third', `${t0} , ${t1}`);
  save(); render();
}

function suggestThirdAuto(){
  if(!isAdmin()){ alert('Chỉ admin'); return; }
  let c = calc();
  let tt = c.rankings['67']?._thirdList||[];
  let eligible = data().allowZeroThird ? tt : tt.filter(x=>x.w>0);
  if(eligible.length<2){ alert('Không đủ 2 cặp hợp lệ'); return; }
  byId('pickThird0').value = eligible[0].id;
  byId('pickThird1').value = eligible[1].id;
}

function swapThirds(){
  if(!isAdmin()){ alert('Chỉ admin'); return; }
  let a = byId('pickThird0').value, b = byId('pickThird1').value;
  byId('pickThird0').value = b;
  byId('pickThird1').value = a;
}

function unlockThird(){
  if(!isAdmin()){ alert('Chỉ admin'); return; }
  if(Object.keys(data().scores).some(id=>id.includes('R16')||id.includes('QF')||id.includes('SF')||id.includes('FINAL'))){
    if(!confirm('Đã có kết quả vòng loại trực tiếp. Mở khoá có thể làm vô hiệu các kết quả đó. Tiếp tục?')) return;
  }
  data().thirdChoice=[]; data().thirdChoiceLockedAt=null; data().thirdChoiceLockedBy=null;
  logAction('unlock_third','');
  save(); render();
}

function setManual(g,b){
  if(!isAdmin()){ alert('Chỉ admin'); return; }
  let ids=getBoards(g)[b].map(p=>p.id);
  let raw=prompt('Điền thứ tự toàn bảng bằng mã cặp, phân cách dấu phẩy.\nCác mã: '+ids.join(', '), ids.join(', '));
  if(raw===null) return;
  let arr=raw.split(',').map(s=>s.trim());
  if(arr.length!==ids.length||new Set(arr).size!==ids.length||arr.some(s=>!ids.includes(s))){
    alert('Danh sách không hợp lệ'); return;
  }
  data().manual[`${g}-${b}`]=arr;
  logAction('manual_rank', `${g}-${b}: ${arr.join(',')}`);
  save(); render();
}

        <li>Sau vòng bảng: vòng 1/8 gồm 8 trận; tứ kết 4 trận; bán kết 2 trận; chung kết 1 trận cho mỗi trình. Không tranh hạng Ba (hai đôi thua bán kết đồng giải Ba).</li>
        <li><b>Tính số trận:</b> Trình 6–7: 24 trận bảng + 15 trận loại trực tiếp = 39 trận; Trình 8–9: 36 trận bảng + 15 trận loại trực tiếp = 51 trận. Tổng cộng 90 trận.</li>
      </ol>

    <div class="doc-article">

      <ol>
        <li>Tất cả các trận từ vòng bảng đến chung kết chỉ thi đấu 01 ván duy nhất; đội đạt <b>11 điểm</b> trước là thắng (kể cả 11–10); không yêu cầu thắng cách biệt 2 điểm. Đây là quy định riêng của giải, khác luật tính điểm tiêu chuẩn quốc tế.</li>
        <li><b>Đổi sân 01 lần</b> khi đội đầu tiên đạt 6 điểm; không đặt lại điểm hay thứ tự giao bóng. Trọng tài nhắc vận động viên và xác nhận điểm trước khi giao tiếp.</li>
        <li>Áp dụng cách ghi điểm truyền thống: chỉ bên giao bóng được ghi điểm; thực hiện thứ tự giao bóng, chuyển quyền giao, quy tắc hai lần nảy, vùng cấm vô-lê, các lỗi giao bóng và bóng ngoài sân theo luật Pickleball kỹ thuật hiện hành, trừ phần chạm 11 đã nêu.</li>
        <li>Trọng tài công bố điểm rõ ràng, theo dõi giao bóng, xử lý tình huống và ký xác nhận biên bản.</li>

async function submitLogin(){
  let u=byId('loginUser').value.trim().toLowerCase();
  let p=byId('loginPass').value;
  let r=await tryLogin(u,p);
  if(!r.ok){
    byId('loginErr').style.display='block';
    byId('loginErr').textContent=r.err;
    return;
  }
  // Kiểm tra role vs modal
  if(modalState.role==='admin' && currentUser.role!=='admin'){
    byId('loginErr').style.display='block';
    byId('loginErr').textContent='Tài khoản này không có quyền admin';
    currentUser=null; return;
  }
  closeModal(); render();
  if(screen==='admin' && !isAdmin()) screen='overview';
}

async function submitChangePw(){
  let p1=byId('newPw').value, p2=byId('newPw2').value;
  if(p1!==p2){ byId('pwErr').style.display='block'; byId('pwErr').textContent='Hai mật khẩu không khớp'; return; }
  if(p1.length<4){ byId('pwErr').style.display='block'; byId('pwErr').textContent='Mật khẩu tối thiểu 4 ký tự'; return; }
  let r=await changePassword(modalState.username, p1);
  if(!r.ok){ byId('pwErr').style.display='block'; byId('pwErr').textContent=r.err; return; }
  alert('Đã đổi mật khẩu cho ' + modalState.username);
  closeModal(); render();
}

function restore(text){
  let obj=JSON.parse(text);
  if(obj.type==='PKL_QT_2026_PA1_V3' && obj.store){
    if(!confirm('Nạp sao lưu sẽ thay thế toàn bộ dữ liệu. Tiếp tục?')) return;
    store=obj.store; save(); location.reload(); return;
  }
  // backward compat: bản cũ
  let p = obj.type==='PKL_QT_2026_PA1' ? obj.PA1 : (obj.type==='PKL_QT_2026'?obj.store?.PA1:null);
  if(!p?.people||p.people.length!==50) throw Error('Tệp sao lưu không đúng định dạng');
  if(!confirm('Nạp bản sao lưu phiên bản cũ (chỉ dữ liệu PA1, không có tài khoản)?')) return;
  store.PA1={...store.PA1, ...p};
  save(); location.reload();
}

function parseCSV(txt){
  txt=txt.replace(/^\ufeff/,'');
  let lines=[],row=[],field='',q=false;
  for(let i=0;i<txt.length;i++){
    let ch=txt[i];
    if(ch==='"'){
      if(q&&txt[i+1]==='"'){ field+='"'; i++; } else q=!q;
    } else if(ch===','&&!q){ row.push(field); field=''; }
    else if((ch==='\r'||ch==='\n')&&!q){
      if(ch==='\r'&&txt[i+1]==='\n')i++;
      row.push(field); field='';
      if(row.some(x=>x!=='')) lines.push(row);
      row=[];
    } else field+=ch;
  }
  row.push(field);
  if(row.some(x=>x!=='')) lines.push(row);
  return lines;
}

async function xlsxRows(buffer){
  if(typeof JSZip==='undefined') throw Error('Bộ đọc XLSX chưa tải được');
  let zip=await JSZip.loadAsync(buffer);
  const get=async path=>{let f=zip.file(path); return f?await f.async('text'):null;};
  let wbxml=await get('xl/workbook.xml'), rels=await get('xl/_rels/workbook.xml.rels');
  if(!wbxml||!rels) throw Error('Tệp XLSX không có cấu trúc workbook');
  const doc=x=>new DOMParser().parseFromString(x,'application/xml');
  let w=doc(wbxml), r=doc(rels), sheets=[...w.getElementsByTagNameNS('*','sheet')];
  let s=sheets.find(x=>x.getAttribute('name')==='DANH_SACH');
  if(!s) throw Error('Không tìm thấy sheet DANH_SACH');
  let rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
  let rel=[...r.getElementsByTagNameNS('*','Relationship')].find(x=>x.getAttribute('Id')===rid);
  if(!rel) throw Error('Không tìm thấy quan hệ sheet');
  let target=rel.getAttribute('Target').replace(/^\//,'');
  let path=target.startsWith('xl/')?target:'xl/'+target;
  path=path.replaceAll('xl/../','');
  let sheetXml=await get(path);
  if(!sheetXml) throw Error('Không đọc được '+path);
  let ss=await get('xl/sharedStrings.xml'), shared=[];
  if(ss){ for(let si of doc(ss).getElementsByTagNameNS('*','si')) shared.push([...si.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('')); }
  let rows=[];
  for(let xrow of doc(sheetXml).getElementsByTagNameNS('*','row')){
    let out=[];
    for(let cell of xrow.getElementsByTagNameNS('*','c')){
      let address=cell.getAttribute('r'), letters=address.match(/^[A-Z]+/)[0], ind=0;
      for(let ch of letters) ind=ind*26+ch.charCodeAt(0)-64;
      ind--;
      let typ=cell.getAttribute('t'), v=cell.getElementsByTagNameNS('*','v')[0]?.textContent??'';
      let inline=cell.getElementsByTagNameNS('*','is')[0];
      out[ind]= typ==='s' ? (shared[Number(v)]??'') : typ==='inlineStr' ? (inline?.textContent??'') : v;
    }
    rows.push(out);
  }
  return rows;
}

function parsePeople(rows){
  let raw=rows.filter(x=>x&&x.some(v=>clean(v)));
  let header=(raw[0]||[]).map(x=>clean(x).toLowerCase().replace(/\s/g,'_'));
  let needed=['ma_cap','khoi','lop','vdv_1','vdv_2','bang','vi_tri','ghi_chu'];
  if(needed.some(x=>!header.includes(x))) throw Error('Sai cột. Cần: '+needed.join(', '));
  let list=raw.slice(1).filter(row=>clean(row[header.indexOf('ma_cap')])).map(row=>{
    let o={};
    for(let col of needed) o[col]=clean(row[header.indexOf(col)]);
    return {id:o.ma_cap, grade:Number(o.khoi), className:o.lop, p1:o.vdv_1, p2:o.vdv_2,
      board:o.bang.toUpperCase().replace('BẢNG ','').replace('BANG ',''),
      pos:o.vi_tri.toUpperCase(), note:o.ghi_chu};
  });
  if(list.length!==50) throw Error('Cần đúng 50 cặp; tệp có '+list.length);
  let ids=list.map(x=>x.id);
  if(new Set(ids).size!==50) throw Error('Trùng mã cặp');
  let known=new Set(INITIAL.map(x=>x.id));
  if(ids.some(x=>!known.has(x))) throw Error('Có mã cặp không thuộc danh sách gốc');
  return list;
}

async function importFile(ev){
  if(!isAdmin()){ alert('Chỉ admin được nạp Excel'); ev.target.value=''; return; }
  let f=ev.target.files[0]; if(!f) return;
  try{
    let arr=f.name.toLowerCase().endsWith('.csv')?parseCSV(await f.text()):await xlsxRows(await f.arrayBuffer());
    let list=parsePeople(arr);
    let test=structuredClone(store[mode]); test.people=list;
    let old=store[mode]; store[mode]=test;
    let v=validate(); store[mode]=old;
    if(v.errors.length) throw Error('Dữ liệu chưa hợp lệ: '+v.errors.slice(0,6).join(' | ')+' (Tổng '+v.errors.length+' lỗi).');
    if(!confirm(`Tệp hợp lệ: ${list.length} cặp. Nạp vào PA1 và xóa kết quả đã nhập?`)) return;
    store[mode]={people:list,scores:{},manual:{},thirdChoice:[],thirdChoiceLockedAt:null,thirdChoiceLockedBy:null,allowZeroThird:false};
    logAction('import_excel', list.length+' cặp');
    save(); screen='overview'; render();
    alert('Đã nhập danh sách và tạo lịch đấu.');
  } catch(err){ alert('Không thể nhập Excel: '+err.message); }
  finally{ ev.target.value=''; }
}
